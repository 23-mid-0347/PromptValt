[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "promptvault"
version = "0.1.0"
description = "Query-aware relevance compression middleware for LLM conversation history"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "tiktoken>=0.7",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    "numpy>=1.26",
    "transformers>=4.40",
    "torch>=2.2",
]

[project.optional-dependencies]
langgraph = ["langgraph>=0.2"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/promptvault"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires network access to huggingface.co / tiktoken's CDN",
]
