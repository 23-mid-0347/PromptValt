name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and optional LangGraph adapter
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,langgraph]'
      - name: Lint the new adapter and adapter tests
        run: ruff check src/promptvault/integrations/langgraph.py tests/test_langgraph_integration.py
      - name: Run offline unit tests
        run: pytest -q -m 'not integration'
      - name: Run LangGraph reducer integration test
        run: pytest -q tests/test_langgraph_integration.py -m integration
